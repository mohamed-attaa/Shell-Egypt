<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Verification - Shell</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  color: #333;
  background: #fff;
}

a {
  text-decoration: none;
  color: inherit;
}

/* ================= TOP BAR ================= */

.topbar {
  border-bottom: 1px solid #e2e2e2;
}

.topbar-inner {
  max-width: 1300px;
  margin: 0 auto;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo svg {
  display: block;
}

.lang-switch {
  font-size: 13px;
  color: #333;
  font-family: 'Segoe UI', Tahoma, sans-serif;
}

/* ================= TITLE BAR ================= */

.title-bar {
  max-width: 1300px;
  margin: 0 auto;
  padding: 0 24px;
}

.title-bar-inner {
  padding: 14px 0 10px;
}

.title-bar h1 {
  font-size: 14px;
  font-weight: 700;
  color: #1a1a1a;
  transform: translate(-10px, -5px);
}

.title-underline {
  display: flex;
  width: 100vw;
  height: 4px;
  position: relative;
  left: 50%;
  right: 50%;
  margin-left: -50vw;
  margin-right: -50vw;
}

.underline-yellow {
  width: 15%;
  background: #ffd900;
}

.underline-dark {
  flex: 1;
  background: #3a3a3a;
}

/* ================= BREADCRUMB ================= */

.breadcrumb {
  border-bottom: 1px solid #e2e2e2;
}

.breadcrumb-inner {
  max-width: 1300px;
  margin: 0 auto;
  padding: 25px 24px 14px;
  font-size: 13px;
  color: #003b5c;
  display: flex;
  align-items: center;
  gap: 6px;
}

.breadcrumb-inner a {
  color: #003b5c;
}

.breadcrumb-inner .chevron {
  color: #999;
}

.breadcrumb-inner .current {
  color: #444;
}

/* ================================================= */
/* ================= VERIFICATION ================== */
/* ================================================= */

.verification-section {
  max-width: 1300px;
  margin: 0 auto;
  padding: 28px 24px 70px;
}

/* العنوان */

.verification-title {
  text-align: center;
  font-family: Tahoma, Arial, sans-serif;
  font-size: 18px;
  font-weight: 700;
  color: #111;
  text-decoration: underline;
  text-underline-offset: 7px;
  margin-bottom: 28px;
}

/* الخط الأحمر */

.verification-red-line {
  width: 60%;
  height: 10px;
  background: #ed1c24;
  margin-bottom: 28px;
}

/* المحتوى */

.verification-content {
  max-width: 1000px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
  direction: rtl;
}

/* ================= RIGHT SIDE ================= */

.help-area {
  text-align: right;
  padding-top: 0;
}

.help-title {
  font-family: Tahoma, Arial, sans-serif;
  font-size: 18px;
  font-weight: 700;
  line-height: 1.8;
  color: #111;
  margin-bottom: 12px;
}

.help-question {
  font-family: Tahoma, Arial, sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: #111;
  margin-bottom: 55px;
}

.help-button {
  width: 330px;
  height: 72px;
  border: none;
  background: #ed1c24;
  color: #fff;
  font-family: Tahoma, Arial, sans-serif;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

.help-button:hover {
  background: #d71920;
}

/* ================= LEFT SIDE ================= */

.product-form {
  direction: rtl;
  padding-top: 0;
}

.required-text {
  font-family: Tahoma, Arial, sans-serif;
  font-size: 11px;
  color: #777;
  text-align: right;
  margin-bottom: 20px;
}

.required-text span {
  color: #ed1c24;
  font-size: 15px;
  margin-right: 3px;
}

.product-label {
  display: block;
  font-family: Tahoma, Arial, sans-serif;
  font-size: 14px;
  color: #333;
  margin-bottom: 12px;
}

.product-input-wrapper {
  display: flex;
  align-items: center;
  width: 100%;
}

.product-help-icon {
  width: 17px;
  height: 17px;
  border: 1px solid #555;
  color: #333;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  font-size: 12px;
  flex-shrink: 0;
  margin-left: 7px;
}

.product-input {
  width: 100%;
  height: 38px;
  border: none;
  border-bottom: 1px solid #d5d5d5;
  outline: none;
  background: transparent;
  font-family: Tahoma, Arial, sans-serif;
  font-size: 14px;
  text-align: right;
}

/* ================= BUTTONS ================= */

.form-buttons {
  display: flex;
  gap: 20px;
  margin-top: 55px;
}

.form-button {
  width: 205px;
  height: 72px;
  border: none;
  background: #ed1c24;
  color: #fff;
  font-family: Tahoma, Arial, sans-serif;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
}

.form-button:hover {
  background: #d71920;
}

/* ================= BOTTOM YELLOW LINE ================= */

.bottom-line {
  height: 3px;
  background: #FFC72C;
  max-width: 1300px;
  margin: 0 auto;
}

/* ================= FOOTER ================= */

.site-footer {
  margin-top: 0;
}

.footer-top {
  max-width: 1300px;
  margin: 0 auto;
  padding: 20px 24px;
  height: 111px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  border-bottom: 1px solid #e2e2e2;
}

.connect-label {
  font-size: 17px;
  font-weight: 700;
  color: #1a1a1a;
}

.social-icons {
  display: flex;
}

.social-icons a {
  width: 69px;
  height: 69px;
  border: 1px solid #d9d9d9;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #1a1a1a;
}

.social-icons a + a {
  border-left: none;
}

.social-icons svg {
  width: 20px;
  height: 20px;
}

.footer-bottom {
  max-width: 1300px;
  margin: 0 auto;
  padding: 50px 30px;
  display: flex;
  gap: 40px;
  flex-wrap: wrap;
  transform: translateY(-10px);
}

.footer-bottom a {
  font-size: 13px;
  color: #003b5c;
}

/* ================= RESPONSIVE ================= */

@media (max-width: 700px) {

  .verification-section {
    padding: 25px 18px 50px;
  }

  .verification-red-line {
    height: 7px;
  }

  .verification-content {
    grid-template-columns: 1fr;
    gap: 45px;
  }

  .help-area {
    order: 1;
  }

  .product-form {
    order: 2;
  }

  .help-button {
    width: 100%;
  }

  .form-buttons {
    gap: 10px;
  }

  .form-button {
    width: 50%;
  }

  .footer-top {
    max-width: 1300px;
    margin: 0 auto;
    height: 111px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    border-bottom: 1px solid #e2e2e2;
    flex-wrap: wrap;
  }
  .footer-bottom {
    padding: 30px 20px;
  }
}
</style>
</head>

<body>

<!-- ================================================= -->
<!-- ================= TOP NAVBAR ==================== -->
<!-- ================================================= -->

<header class="topbar">

  <div class="topbar-inner">

     <a href="#" class="logo">
  <img src="./img/shell-logo.png" alt="Shell" width="70" height="70">
</a>

    <a href="#" class="lang-switch">
      عربي
    </a>

  </div>

</header>


<!-- ================================================= -->
<!-- ================= TITLE BAR ===================== -->
<!-- ================================================= -->

<div class="title-bar">

  <div class="title-bar-inner">
    <h1>Check Product Authenticity</h1>
  </div>

  <div class="title-underline">
    <span class="underline-yellow"></span>
    <span class="underline-dark"></span>
  </div>

</div>


<!-- ================================================= -->
<!-- ================= BREADCRUMB ==================== -->
<!-- ================================================= -->

<nav class="breadcrumb">

  <div class="breadcrumb-inner">

    <a href="verification.html">
      Shell Egypt
    </a>

    <span class="chevron">
      &#8250;
    </span>

    <span class="current">
      Product Verification
    </span>

  </div>

</nav>


<!-- ================================================= -->
<!-- =============== VERIFICATION AREA =============== -->
<!-- ================================================= -->

<section class="verification-section">

  <h2 class="verification-title">
    التحقق من المنتج
  </h2>

  <div class="verification-red-line"></div>


  <div class="verification-content">


    <!-- ================= HELP ================= -->

    <div class="help-area">

      <h3 class="help-title">
        هل تحتاج إلى مساعدة في العثور على رمز المنتج؟
      </h3>

      <div class="help-question">
        ؟
      </div>

      <button
        class="help-button"
        type="button"
        onclick="showHelp()">

        اضغط هنا لمعرفة المزيد

      </button>

    </div>


    <!-- ================= FORM ================= -->

    <div class="product-form">

      <div class="required-text">
        <span>*</span>
        حقول مطلوبة
      </div>

      <label class="product-label">
        رمز المنتج؟
      </label>

      <div class="product-input-wrapper">

        <div class="product-help-icon">
          ?
        </div>

        <input
          id="productCode"
          class="product-input"
          type="text"
          autocomplete="off"
        >

      </div>


      <div class="form-buttons">

        <button
          class="form-button"
          type="button"
          onclick="clearProductCode()">

          مسح

        </button>

        <button
          class="form-button"
          type="button"
          onclick="registerProduct()">

          سجل

        </button>

      </div>

    </div>

  </div>

</section>


<!-- ================================================= -->
<!-- ================= FOOTER LINE =================== -->
<!-- ================================================= -->

<div class="bottom-line"></div>


<!-- ================================================= -->
<!-- ==================== FOOTER ===================== -->
<!-- ================================================= -->

<footer class="site-footer">

  <div class="footer-top">

    <span class="connect-label">
      Connect with us
    </span>

    <div class="social-icons">

      <!-- YouTube -->
      <a href="#" aria-label="YouTube">

        <svg viewBox="0 0 24 24"
             fill="currentColor">

          <path d="M23.5 6.2c-.3-1.1-1.1-1.9-2.2-2.2C19.3 3.5 12 3.5 12 3.5s-7.3 0-9.3.5c-1.1.3-1.9 1.1-2.2 2.2C0 8.2 0 12 0 12s0 3.8.5 5.8c.3 1.1 1.1 1.9 2.2 2.2 2 .5 9.3.5 9.3.5s7.3 0 9.3-.5c1.1-.3 1.9-1.1 2.2-2.2.5-2 .5-5.8.5-5.8s0-3.8-.5-5.8zM9.6 15.6V8.4l6.3 3.6-6.3 3.6z"/>

        </svg>

      <!-- Twitter -->
      <a href="#" aria-label="Twitter">

        <svg viewBox="0 0 24 24"
             fill="currentColor">

          <path d="M23.4 4.9c-.8.4-1.7.7-2.6.8.9-.6 1.7-1.5 2-2.5-.9.5-1.9.9-2.9 1.1-.8-.9-2-1.5-3.3-1.5-2.5 0-4.5 2-4.5 4.5 0 .4 0 .7.1 1-3.8-.2-7.1-2-9.4-4.8-.4.7-.6 1.5-.6 2.3 0 1.6.8 3 2 3.8-.7 0-1.4-.2-2-.6v.1c0 2.2 1.6 4 3.6 4.4-.4.1-.8.2-1.2.2-.3 0-.6 0-.8-.1.6 1.8 2.2 3.1 4.2 3.1-1.5 1.2-3.5 1.9-5.6 1.9-.4 0-.7 0-1.1-.1 2 1.3 4.4 2 6.9 2 8.3 0 12.9-6.9 12.9-12.9v-.6c.9-.6 1.6-1.4 2.3-2.3z"/>

      <!-- Facebook -->
      <a href="#" aria-label="Facebook">

          <path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12z"/>

        </svg>

      </a>


      <!-- LinkedIn -->
      <a href="#" aria-label="LinkedIn">

        <svg viewBox="0 0 24 24"

        </svg>

      <!-- Instagram -->
      <a href="#" aria-label="Instagram">

        <svg viewBox="0 0 24 24"
             fill="none"

          <rect x="3"
                y="3"

                rx="4"/>

          <circle cx="12"
                  cy="12"

          <circle cx="17.2"

    </div>

  </div>


  <div class="footer-bottom">

    <a href="#">
      Terms &amp; Conditions
    </a>

    <a href="#">
      Privacy Policy
    </a>

    <a href="#">
      Cookie Policy
    </a>

    <a href="#">
      Modify Cookie Preferences
    </a>

  </div>

</footer>


<script>

function clearProductCode() {
  document.getElementById("productCode").value = "";
}

function registerProduct() {

  const code =
    document.getElementById("productCode").value.trim();

  if (code === "") {
    alert("برجاء إدخال رمز المنتج");
    return;
  }

  alert("تم إدخال رمز المنتج: " + code);
}

function showHelp() {
  alert("يمكنك العثور على رمز المنتج على عبوة المنتج.");
}

</script>

</body>
</html>
